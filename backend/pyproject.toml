[project]
name = "voyagemesh-backend"
version = "0.1.0"
description = "An intelligent multi-agent travel planning system powered by LangGraph, MCP, Guardrails, and HITL workflows"
requires-python = ">=3.11"
dependencies = [
    "airportsdata>=20260905",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "langchain>=1.4.0",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg-pool>=3.3.1",
    "psycopg[binary]>=3.3.5",
    "pycountry>=26.2.16",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.52",
    "tavily-python>=0.8.2",
    "uvicorn>=0.52.4",
]
